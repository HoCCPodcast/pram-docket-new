<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pram Phone Dock – 3D Concept</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#eee8eb}canvas{display:block}
    #app{position:fixed;inset:0}.panel{position:fixed;z-index:2;top:20px;left:20px;max-width:360px;padding:20px;border-radius:20px;background:rgba(255,255,255,.9);box-shadow:0 14px 35px rgba(0,0,0,.12)}
    .eyebrow{margin:0 0 7px;color:#c12669;font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}h1{margin:0;font-size:34px}.panel p{line-height:1.45;color:#5d5559}.buttons{display:flex;flex-wrap:wrap;gap:8px}.buttons button{border:0;border-radius:999px;padding:10px 13px;font-weight:700;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);cursor:pointer}.buttons button.active{background:#c12669;color:#fff}.help{position:fixed;right:18px;bottom:18px;z-index:2;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.88);font-weight:700;color:#4d4549}.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:#eee8eb;font-weight:700}
    @media(max-width:650px){.panel{top:12px;left:12px;right:12px;max-width:none;padding:16px}.panel p.desc{display:none}.help{left:12px;right:12px;text-align:center}}
  </style>
</head>
<body>
  <div id="loading" class="loading">Loading 3D model…</div>
  <div id="app"></div>
  <section class="panel">
    <p class="eyebrow">House of Coffee &amp; Chaos</p>
    <h1>Pram Dock</h1>
    <p class="desc">Magnetic phone dock with a flexible strap and discreet side-mounted solar trickle charger.</p>
    <div class="buttons">
      <button id="front">Front</button><button id="side">Solar side</button><button id="back">Back</button><button id="rotate" class="active">Auto rotate</button>
    </div>
  </section>
  <div class="help">Drag to rotate · Scroll to zoom</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/controls/OrbitControls.js';

    const app=document.getElementById('app');
    const scene=new THREE.Scene();
    scene.fog=new THREE.Fog(0xeee8eb,14,28);
    const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
    camera.position.set(8,5,11);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;app.appendChild(renderer.domElement);
    const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=6;controls.maxDistance=22;controls.target.set(0,1.5,0);controls.autoRotate=true;controls.autoRotateSpeed=1.2;

    const mat=(c,r=.5,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
    const pink=mat(0xc12669,.42,.08), black=mat(0x171518,.35,.12), charcoal=mat(0x343034,.5,.18), silver=mat(0xc9c6c8,.22,.8), silicone=mat(0x272428,.85,.02), solar=mat(0x172a3a,.25,.58);
    const group=new THREE.Group();scene.add(group);

    function roundedBox(w,h,d,r,material){
      const s=new THREE.Shape(),x=-w/2,y=-h/2;
      s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
      const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSegments:4,bevelSize:r*.35,bevelThickness:r*.35,curveSegments:10});g.center();
      const mesh=new THREE.Mesh(g,material);mesh.castShadow=true;mesh.receiveShadow=true;return mesh;
    }

    const handle=new THREE.Mesh(new THREE.CylinderGeometry(.56,.56,10.5,64),silicone);handle.rotation.z=Math.PI/2;handle.position.set(0,0,-1.2);handle.castShadow=true;group.add(handle);
    const strap=new THREE.Mesh(new THREE.TorusGeometry(.78,.22,28,90,Math.PI*1.68),pink);strap.rotation.x=Math.PI/2;strap.rotation.z=.55;strap.position.set(0,0,-1.2);strap.scale.y=1.18;group.add(strap);
    const connector=roundedBox(2.2,1,.7,.22,pink);connector.position.set(0,.8,-.72);group.add(connector);

    const dock=roundedBox(3.35,4.9,.78,.42,charcoal);dock.position.set(0,3,-.35);group.add(dock);
    const face=roundedBox(2.78,4.3,.28,.35,black);face.position.set(0,3,.18);group.add(face);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.82,.09,24,72),silver);ring.position.set(0,3.3,.38);group.add(ring);
    const centre=new THREE.Mesh(new THREE.CylinderGeometry(.66,.66,.12,64),black);centre.rotation.x=Math.PI/2;centre.position.set(0,3.3,.38);group.add(centre);

    const phone=new THREE.Group();phone.position.set(0,3.15,.73);phone.rotation.z=-.03;group.add(phone);
    phone.add(roundedBox(3,5.85,.42,.48,black));
    const screen=roundedBox(2.72,5.55,.08,.4,mat(0x211c21,.28,.06));screen.position.z=.25;phone.add(screen);
    const pill=roundedBox(1.35,.18,.035,.08,black);pill.position.set(0,2.35,.32);phone.add(pill);
    const badge=roundedBox(2.15,1.15,.035,.22,pink);badge.position.set(0,.2,.32);phone.add(badge);

    const solarGroup=new THREE.Group();solarGroup.position.set(2.25,1.2,-.55);solarGroup.rotation.z=-.08;group.add(solarGroup);
    const mount=roundedBox(.52,1.1,.52,.15,pink);mount.position.x=-.36;solarGroup.add(mount);
    const panel=roundedBox(1.55,3.35,.25,.24,solar);solarGroup.add(panel);
    const lineMat=new THREE.MeshBasicMaterial({color:0x7896a6,transparent:true,opacity:.75});
    for(let i=-2;i<=2;i++){const l=new THREE.Mesh(new THREE.BoxGeometry(1.14,.018,.012),lineMat);l.position.set(0,i*.5,.15);solarGroup.add(l)}
    for(let i=-1;i<=1;i++){const l=new THREE.Mesh(new THREE.BoxGeometry(.018,2.76,.012),lineMat);l.position.set(i*.38,0,.15);solarGroup.add(l)}

    const lightMat=new THREE.MeshStandardMaterial({color:0x50d889,emissive:0x50d889,emissiveIntensity:2});
    const led=new THREE.Mesh(new THREE.SphereGeometry(.09,20,20),lightMat);led.position.set(0,1.22,.48);group.add(led);

    const floor=new THREE.Mesh(new THREE.CircleGeometry(11,96),new THREE.ShadowMaterial({color:0x111111,opacity:.14}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.05;floor.receiveShadow=true;scene.add(floor);
    scene.add(new THREE.HemisphereLight(0xffffff,0x75666e,2.1));
    const key=new THREE.DirectionalLight(0xffffff,4.5);key.position.set(6,10,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
    const rim=new THREE.DirectionalLight(0xffdce9,2.6);rim.position.set(-5,5,-8);scene.add(rim);

    function view(x,y,z){controls.autoRotate=false;document.getElementById('rotate').classList.remove('active');camera.position.set(x,y,z);camera.lookAt(controls.target)}
    document.getElementById('front').onclick=()=>view(0,3.5,13);
    document.getElementById('side').onclick=()=>view(13,3.5,1);
    document.getElementById('back').onclick=()=>view(0,3.5,-13);
    document.getElementById('rotate').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.classList.toggle('active',controls.autoRotate)};

    const clock=new THREE.Clock();
    function animate(){requestAnimationFrame(animate);lightMat.emissiveIntensity=1.7+Math.sin(clock.getElapsedTime()*3)*.6;controls.update();renderer.render(scene,camera)}animate();
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    document.getElementById('loading').remove();
  </script>
</body>
</html>
